name: ci
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "harness[dev]"
      - run: make fixtures && git diff --exit-code harness/fixtures  # fixtures must be reproducible
      - run: make test
      - run: docker compose --profile sim --profile video config -q
      - run: docker compose --profile sim build
      # import-only smoke: a clean build can still ship a missing runtime dep (python-ulid 4.x -> typing_extensions)
      - run: for s in sim ingest; do docker compose run --rm --no-deps $s python -c "import main"; done
      # edge image skipped: slow torch + ultralytics build. The same import check applies if it gets its own job
