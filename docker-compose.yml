# Two ways to feed the lab (pick one profile):
#   --profile sim    synthetic traffic, no footage or model needed        (make up)
#   --profile video  looping video over RTSP -> YOLO + tracker on CPU     (make up-video)
# Either way: edge -> Toxiproxy (impaired uplink) -> EMQX -> ingest -> Postgres -> Grafana
services:
  mediamtx:
    profiles: [video]
    image: bluenviron/mediamtx:latest
    ports: ["8554:8554"]
    restart: unless-stopped

  camera:  # loops ./media/sample.mp4 forever as rtsp://mediamtx:8554/cam1
    image: linuxserver/ffmpeg:latest
    profiles: [video]
    depends_on: [mediamtx]
    volumes: ["./media:/media:ro"]
    command: >
      -re -stream_loop -1 -i /media/sample.mp4
      -c:v libx264 -preset veryfast -tune zerolatency -an
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam1
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    ports: ["18083:18083"]  # dashboard: admin / public
    environment:  # keep ingest's session and its queued events on disk across a broker restart
      EMQX_DURABLE_SESSIONS__ENABLE: "true"
      EMQX_CLUSTER__DISCOVERY_STRATEGY: singleton  # required by the local durable storage backend
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      retries: 20
    restart: unless-stopped  # every service: after a Docker restart the lab comes back whole, not half-up

  toxiproxy:  # the "cellular uplink": edge talks to the broker only through here
    image: ghcr.io/shopify/toxiproxy:2.9.0
    depends_on: { emqx: { condition: service_healthy } }
    ports: ["8474:8474"]
    volumes: ["./chaos/toxiproxy.json:/config/toxiproxy.json:ro"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: lab, POSTGRES_DB: lab }
    ports: ["5432:5432"]
    restart: unless-stopped

  ingest:
    build: ./services/ingest
    depends_on: { postgres: { condition: service_started }, emqx: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:lab@postgres:5432/lab
      MQTT_HOST: emqx
    restart: unless-stopped

  edge:
    profiles: [video]
    build: { context: ., dockerfile: services/edge/Dockerfile }
    depends_on: [camera, toxiproxy]
    environment:
      RTSP_URL: rtsp://mediamtx:8554/cam1
      DEVICE_ID: edge-01
      MQTT_HOST: toxiproxy
      TRACKER: bytetrack.yaml
      ZONE_POLYGON: "[[400,200],[800,200],[800,600],[400,600]]"
    mem_limit: 2g   # lower this to reproduce OOM crash loops
    restart: unless-stopped

  sim:  # no-video edge node: seeded synthetic traffic, runs naive and debounced counters side by side
    profiles: [sim]
    build: { context: ., dockerfile: services/sim/Dockerfile }
    depends_on: [toxiproxy]
    environment: { DEVICE_ID: sim-01, MQTT_HOST: toxiproxy, SPEED: "2" }
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    depends_on: [postgres]
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: lab
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/edge-cv-lab.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
