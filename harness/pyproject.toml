[project]
name = "edge-cv-replay"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["ultralytics>=8.3", "opencv-python-headless"]
viz = ["opencv-python-headless", "numpy", "matplotlib", "imageio", "pillow>=9.1"]  # 9.1: Image.Quantize and Image.Dither enums

[tool.setuptools.packages.find]
include = ["replay*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
